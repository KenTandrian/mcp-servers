name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit

      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done

      - name: Stage unpublished versions
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          for tgz in *.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | jq -r '.name + "@" + .version')
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "Skipping $spec (already published)"
              continue
            fi
            echo "Staging $spec"
            npm stage publish "./$tgz" --access public --provenance
          done
